    rule = ["python", "pandas", "numpy", "scikit-learn", "matplotlib", "sqlalchemy", "pytest"]
  [profiles."backend-go"]
    rule = ["go", "postgresql", "redis", "servemux"]
  [profiles."devops"]
    rule = ["docker", "kubernetes", "terraform", "ansible", "nginx", "github-actions"]
  [profiles."ml-core"]
    rule = ["python", "pytorch", "transformers", "huggingface", "cuda"]

